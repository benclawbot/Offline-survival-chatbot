name: Build and release v0.03
# Builds the checked-in main branch with checksum-verified assets and the smaller model.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch verified offline assets
        run: bash scripts/fetch-offline-assets.sh
      - name: Verify model starts on CPU
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew :harness:run --no-daemon --args="$GITHUB_WORKSPACE/app/src/main/assets/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm Hello" | tee model-smoke.log
          grep -q "engine initialized" model-smoke.log
      - name: Verify offline index supports FTS5 searches
        shell: bash
        run: |
          set -euo pipefail
          unzip -p app/src/main/assets/library-lite.zip index.sqlite > /tmp/survival-index.sqlite
          python3 -c "import sqlite3; c=sqlite3.connect('file:/tmp/survival-index.sqlite?mode=ro',uri=True); assert c.execute(\"SELECT rowid FROM fts WHERE fts MATCH ? ORDER BY rank LIMIT 1\", ('water',)).fetchone()"
          rm /tmp/survival-index.sqlite
      - name: Build the all-in-one APK
        run: bash gradlew :app:assembleDebug --no-daemon
      - name: Check APK size and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          bytes=$(stat -c %s "$apk")
          echo "APK size: $bytes bytes"
          test "$bytes" -lt 2147483648
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" Offline-Survival-Chatbot-v0.03.apk
          sha256sum Offline-Survival-Chatbot-v0.03.apk > Offline-Survival-Chatbot-v0.03.apk.sha256
      - name: Publish v0.03
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.03 Offline-Survival-Chatbot-v0.03.apk Offline-Survival-Chatbot-v0.03.apk.sha256 \
            --target "$GITHUB_SHA" --title "Offline Survival Chatbot v0.03" \
            --notes "Experimental ARM64 build with an English interface, bundled FTS5 search, automatic library retrieval, and a compatible Qwen3 model. On-device installation and inference are not yet verified. Includes the Qwen model and Essentials offline reference library. Signed with an automatically generated debug key; future builds may require uninstalling this version first. Verify safety-critical information with authoritative sources."
